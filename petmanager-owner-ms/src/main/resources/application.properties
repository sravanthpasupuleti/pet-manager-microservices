spring.application.name=petmanager-owner-ms
spring.config.import=configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.number}}

resilience4j.retry.instances.petRetry.maxAttempts=3
resilience4j.retry.instances.petRetry.waitDuration=1s
resilience4j.retry.instances.petRetry.enableExponentialBackoff=true
resilience4j.retry.instances.petRetry.exponentialBackoffMultiplier=2