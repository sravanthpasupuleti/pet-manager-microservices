spring.application.name=petmanager-gateway-server

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.number}}

# Owner Microservice Route
spring.cloud.gateway.server.webflux.routes[0].id=petmanager-owner-ms
spring.cloud.gateway.server.webflux.routes[0].uri=lb://petmanager-owner-ms
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/owners/**
# Pet Microservice Route
spring.cloud.gateway.server.webflux.routes[1].id=petmanager-pet-ms
spring.cloud.gateway.server.webflux.routes[1].uri=lb://petmanager-pet-ms
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/pets/**
# Mail Microservice Route
spring.cloud.gateway.server.webflux.routes[2].id=petmanager-mail-ms
spring.cloud.gateway.server.webflux.routes[2].uri=lb://petmanager-mail-ms
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/mails