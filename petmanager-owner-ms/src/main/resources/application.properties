spring.application.name=petmanager-owner-ms
spring.config.import=configserver:http://localhost:8888
pet.service.base.uri=http://petmanager-pet-ms/pets
mail.service.base.uri=http://petmanager-mail-ms/mails

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.number}}